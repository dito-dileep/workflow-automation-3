<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Loan Origination and Approval System</title><desc id="desc">A visual overview showing application intake, parallel checks, approval, offer, signing and disbursement with exception controls.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fdfa"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#64748b"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.small{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.label{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.task{fill:#fff;stroke:#99f6e4;stroke-width:2}.gate{fill:#ecfeff;stroke:#0f766e;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:1}</style></defs>
  <rect width="1500" height="720" rx="28" fill="url(#bg)"/><text x="54" y="60" class="t" font-size="28" font-weight="800">Loan Origination &amp; Approval System</text><text x="54" y="87" class="small">BPMN 2.0 overview — designed around controlled decisions and recoverable exceptions</text>
  <rect x="42" y="125" width="1415" height="102" rx="12" class="lane"/><text x="58" y="158" class="label">APPLICANT</text>
  <rect x="42" y="238" width="1415" height="162" rx="12" class="lane"/><text x="58" y="270" class="label">CORE BANKING SYSTEM</text>
  <rect x="42" y="411" width="1415" height="116" rx="12" class="lane"/><text x="58" y="443" class="label">CREDIT &amp; OPERATIONS</text>
  <rect x="42" y="538" width="1415" height="138" rx="12" class="lane"/><text x="58" y="570" class="label">EXCEPTION CONTROLS</text>
  <circle cx="155" cy="331" r="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><rect x="200" y="292" width="130" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="265" y="323" text-anchor="middle" class="label">Check document</text><text x="265" y="345" text-anchor="middle" class="small">completeness</text>
  <path d="M171 331H200" class="line"/><path d="M330 331H365" class="line"/><polygon points="395,301 425,331 395,361 365,331" class="gate"/><text x="395" y="389" text-anchor="middle" class="small">complete?</text>
  <path d="M425 331H465" class="line"/><rect x="465" y="292" width="142" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="536" y="323" text-anchor="middle" class="label">KYC verification</text><text x="536" y="345" text-anchor="middle" class="small">service task</text>
  <rect x="635" y="292" width="142" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="706" y="323" text-anchor="middle" class="label">Credit-bureau</text><text x="706" y="345" text-anchor="middle" class="small">score retrieval</text>
  <rect x="805" y="292" width="142" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="876" y="323" text-anchor="middle" class="label">Income &amp; employment</text><text x="876" y="345" text-anchor="middle" class="small">verification</text>
  <path d="M607 331H635M777 331H805M947 331H980" class="line"/><polygon points="1010,301 1040,331 1010,361 980,331" class="gate"/><path d="M1040 331H1070" class="line"/><rect x="1070" y="292" width="148" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="1144" y="323" text-anchor="middle" class="label">Eligibility &amp; risk</text><text x="1144" y="345" text-anchor="middle" class="small">business rule</text>
  <path d="M1218 331H1250" class="line"/><polygon points="1280,301 1310,331 1280,361 1250,331" class="gate"/><text x="1280" y="389" text-anchor="middle" class="small">route</text>
  <rect x="1065" y="145" width="154" height="64" rx="12" class="task" filter="url(#shadow)"/><text x="1142" y="174" text-anchor="middle" class="label">Accept loan offer</text><text x="1142" y="195" text-anchor="middle" class="small">15-day validity</text><rect x="1260" y="145" width="128" height="64" rx="12" class="task" filter="url(#shadow)"/><text x="1324" y="174" text-anchor="middle" class="label">E-sign</text><text x="1324" y="195" text-anchor="middle" class="small">agreement</text>
  <path d="M1310 315V238H1142V209" class="line"/><path d="M1219 177H1260" class="line"/>
  <rect x="1065" y="435" width="154" height="65" rx="12" class="task" filter="url(#shadow)"/><text x="1142" y="464" text-anchor="middle" class="label">Underwriter / committee</text><text x="1142" y="486" text-anchor="middle" class="small">manual review</text><rect x="1260" y="435" width="128" height="65" rx="12" class="task" filter="url(#shadow)"/><text x="1324" y="464" text-anchor="middle" class="label">Disburse funds</text><text x="1324" y="486" text-anchor="middle" class="small">verified account</text><circle cx="1420" cy="467" r="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1420" y="510" text-anchor="middle" class="small">disbursed</text><path d="M1310 347V467H1065M1219 467H1260M1388 467H1404" class="line"/>
  <rect x="210" y="576" width="176" height="66" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="298" y="604" text-anchor="middle" class="label">L1 Document correction</text><text x="298" y="626" text-anchor="middle" class="small">7-day lapse timer</text><rect x="445" y="576" width="176" height="66" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="533" y="604" text-anchor="middle" class="label">L3–L4 Compliance / API</text><text x="533" y="626" text-anchor="middle" class="small">escalate · retry · fallback</text><rect x="680" y="576" width="176" height="66" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="768" y="604" text-anchor="middle" class="label">L5–L8 Policy outcomes</text><text x="768" y="626" text-anchor="middle" class="small">reject · revise · escalate</text><rect x="915" y="576" width="176" height="66" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="1003" y="604" text-anchor="middle" class="label">L9–L11 Offer control</text><text x="1003" y="626" text-anchor="middle" class="small">expire · withdraw · resend</text><rect x="1150" y="576" width="176" height="66" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="1238" y="604" text-anchor="middle" class="label">L12 Payment recovery</text><text x="1238" y="626" text-anchor="middle" class="small">verify · retry · hold</text>
  <path d="M395 361V576H298M706 370V576H533M1144 370V576H768M1142 209V576H1003M1324 500V576H1238" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
</svg>
