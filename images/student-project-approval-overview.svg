<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="670" viewBox="0 0 1500 670" role="img" aria-labelledby="title desc">
  <title id="title">Student Project Approval and Allocation System</title><desc id="desc">BPMN overview of proposal validation, review, guide allocation and exception controls.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".1"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.sm{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.lb{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#172554}.task{fill:#fff;stroke:#c4b5fd;stroke-width:2}.gate{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}.lane{fill:#fff;stroke:#cbd5e1}</style></defs>
  <rect width="1500" height="670" rx="28" fill="url(#bg)"/><text x="54" y="60" class="t" font-size="28" font-weight="800">Student Project Approval &amp; Allocation System</text><text x="54" y="87" class="sm">BPMN 2.0 overview — proposal quality controls, committee decisions and allocation recovery</text>
  <rect x="42" y="125" width="1415" height="96" rx="12" class="lane"/><text x="58" y="156" class="lb">STUDENT / TEAM</text>
  <rect x="42" y="232" width="1415" height="160" rx="12" class="lane"/><text x="58" y="263" class="lb">PROJECT MANAGEMENT SYSTEM &amp; COORDINATOR</text>
  <rect x="42" y="403" width="1415" height="105" rx="12" class="lane"/><text x="58" y="434" class="lb">REVIEW COMMITTEE / FACULTY GUIDE</text>
  <rect x="42" y="519" width="1415" height="112" rx="12" class="lane"/><text x="58" y="550" class="lb">EXCEPTION CONTROLS</text>
  <circle cx="155" cy="312" r="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><rect x="202" y="273" width="142" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="273" y="304" text-anchor="middle" class="lb">Validate proposal</text><text x="273" y="326" text-anchor="middle" class="sm">form + team rules</text><path d="M171 312H202M344 312H375" class="line"/>
  <polygon points="405,282 435,312 405,342 375,312" class="gate"/><text x="405" y="370" text-anchor="middle" class="sm">valid?</text><path d="M435 312H468" class="line"/><rect x="468" y="273" width="142" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="539" y="304" text-anchor="middle" class="lb">Screen proposal</text><text x="539" y="326" text-anchor="middle" class="sm">coordinator review</text><path d="M610 312H643" class="line"/>
  <rect x="643" y="273" width="145" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="716" y="304" text-anchor="middle" class="lb">Duplicate-topic</text><text x="716" y="326" text-anchor="middle" class="sm">similarity check</text><path d="M788 312H822" class="line"/><rect x="822" y="273" width="142" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="893" y="304" text-anchor="middle" class="lb">Evaluate proposal</text><text x="893" y="326" text-anchor="middle" class="sm">committee decision</text><path d="M964 312H996" class="line"/>
  <polygon points="1026,282 1056,312 1026,342 996,312" class="gate"/><text x="1026" y="370" text-anchor="middle" class="sm">approve?</text><path d="M1056 312H1088" class="line"/><rect x="1088" y="273" width="148" height="78" rx="12" class="task" filter="url(#shadow)"/><text x="1162" y="304" text-anchor="middle" class="lb">Match guide capacity</text><text x="1162" y="326" text-anchor="middle" class="sm">domain + workload</text><path d="M1236 312H1268" class="line"/>
  <rect x="1100" y="142" width="146" height="58" rx="12" class="task" filter="url(#shadow)"/><text x="1173" y="168" text-anchor="middle" class="lb">Revise proposal</text><text x="1173" y="188" text-anchor="middle" class="sm">max 2 cycles</text><path d="M1026 282V171H1100" class="line"/>
  <rect x="1060" y="423" width="158" height="62" rx="12" class="task" filter="url(#shadow)"/><text x="1139" y="450" text-anchor="middle" class="lb">Guide accepts request</text><text x="1139" y="472" text-anchor="middle" class="sm">or allocation reruns</text><rect x="1260" y="423" width="126" height="62" rx="12" class="task" filter="url(#shadow)"/><text x="1323" y="450" text-anchor="middle" class="lb">Notify team</text><text x="1323" y="472" text-anchor="middle" class="sm">record allocation</text><circle cx="1420" cy="454" r="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1420" y="496" text-anchor="middle" class="sm">allocated</text><path d="M1236 312V454H1060M1218 454H1260M1386 454H1404" class="line"/>
  <rect x="205" y="552" width="184" height="57" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="297" y="578" text-anchor="middle" class="lb">F1–F4 Intake controls</text><text x="297" y="598" text-anchor="middle" class="sm">correct · reject · late review</text><rect x="445" y="552" width="184" height="57" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="537" y="578" text-anchor="middle" class="lb">F5–F7 Review controls</text><text x="537" y="598" text-anchor="middle" class="sm">revision · reasons · SLA</text><rect x="685" y="552" width="184" height="57" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="777" y="578" text-anchor="middle" class="lb">F8–F9 Guide controls</text><text x="777" y="598" text-anchor="middle" class="sm">manual match · timeout</text><rect x="925" y="552" width="184" height="57" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="1017" y="578" text-anchor="middle" class="lb">F10–F11 Recovery</text><text x="1017" y="598" text-anchor="middle" class="sm">notify retry · release slot</text>
  <path d="M405 342V552H297M893 351V552H537M1162 351V552H777M1323 485V552H1017" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
</svg>
